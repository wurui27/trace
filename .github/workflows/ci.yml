name: CI

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # CI never receives a provider token and never calls a public AI provider.
  # Tests that exercise synthesis inject an in-process or loopback fake.
  PERFPILOT_APP_ENV: test
  PERFPILOT_AI_ENABLED: "false"
  PERFPILOT_AI_BASE_URL: http://127.0.0.1:4010/v1/
  PERFPILOT_AI_PROVIDER_NAME: development-fake
  PERFPILOT_AI_MODEL: fake-json-model
  PERFPILOT_AI_CREDENTIAL_REFERENCE: development-only-ai-credential-reference
  PERFPILOT_AI_CREDENTIAL_FILE: ""
  PERFPILOT_AI_EGRESS_ALLOWLIST: ""
  PERFPILOT_SYNTHESIS_WORKER_ID: ""
  PERFPILOT_REPORT_WORKER_IMAGE_DIGEST: ""
  PERFPILOT_ENGINE_LOCK_FILE: ""
  PERFPILOT_ENGINE_LOCK_SCHEMA_FILE: ""
  OPENAI_API_KEY: ""

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.11.32"
      - name: Sync dependencies
        run: uv sync --locked --all-packages
      - name: Run Ruff
        run: >-
          uv run --locked --package perfpilot-api ruff check
          services/api/src services/api/tests
          agents/device-agent/src agents/device-agent/tests

  python-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PERFPILOT_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
      PERFPILOT_TEST_TENANT_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      PERFPILOT_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      PERFPILOT_REQUIRE_POSTGRES_TESTS: "1"
      PERFPILOT_REQUIRE_REDIS_TESTS: "1"
      PERFPILOT_ANDROID_MEMORY_ROOT: ${{ github.workspace }}/.ci/android-memory
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout platform
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout Android memory analyzer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Gracker/Android-App-Memory-Analysis
          ref: d5514972ced78c3faa7fc17589c1ea9231645056
          path: .ci/android-memory
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.11.32"
      - name: Sync dependencies
        run: uv sync --locked --all-packages
      - name: Run API tests
        run: >-
          uv run --locked --package perfpilot-api pytest -p no:cacheprovider
          services/api/tests -q
      - name: Run Device Agent tests
        run: >-
          uv run --locked --package perfpilot-device-agent pytest -p no:cacheprovider
          agents/device-agent/tests -q

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Lint web
        run: npm run lint
      - name: Test web
        run: npm test

  ci-gate:
    runs-on: ubuntu-latest
    needs:
      - python-quality
      - python-tests
      - web
    if: ${{ always() }}
    steps:
      - name: Require every CI job to succeed
        env:
          PYTHON_QUALITY_RESULT: ${{ needs.python-quality.result }}
          PYTHON_TESTS_RESULT: ${{ needs.python-tests.result }}
          WEB_RESULT: ${{ needs.web.result }}
        run: |
          if [[ "$PYTHON_QUALITY_RESULT" == "success" &&
                "$PYTHON_TESTS_RESULT" == "success" &&
                "$WEB_RESULT" == "success" ]]; then
            exit 0
          fi
          exit 1
